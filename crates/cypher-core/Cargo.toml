[package]
name = "cypher-core"
description = "Cypher Studio: Rust-Kern ohne Tauri-Abhängigkeit (Katalog, Download, Installation, Erkennung, Druckprüfung, Einrichtung, Bibliothek)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Testhilfen für Integrationstests und die Linux-Probe: erlaubt http nur gegen 127.0.0.1
test-util = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { version = "12", features = ["serde-compat"] }

[dev-dependencies]
pretty_assertions = "1"

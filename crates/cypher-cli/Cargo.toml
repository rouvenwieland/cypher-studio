[package]
name = "cypher-cli"
description = "Cypher Studio: Kommandozeile für CI, Linux-Probe und Katalogpflege"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["dev-tools"]
# Entwicklungswerkzeuge: Testschlüssel erzeugen und den Katalog damit signieren. Die echten Schlüssel erzeugt und
# verwahrt die verantwortliche Person offline (minisign -G / -S).
dev-tools = ["dep:minisign"]

[[bin]]
name = "cypher"
path = "src/main.rs"

[dependencies]
cypher-core = { path = "../cypher-core" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
semver = "1"
hex = "0.4"
url = "2"
minisign = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"

[package]
name = "cypher-cli"
description = "Cypher Studio: Kommandozeile für CI, Linux-Probe und Katalogpflege"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["dev-tools"]
# Entwicklungswerkzeuge: Testschlüssel erzeugen und den Katalog damit signieren. Die echten Schlüssel erzeugt und
# verwahrt die verantwortliche Person offline (minisign -G / -S).
dev-tools = ["dep:minisign", "cypher-core/test-util"]

[[bin]]
name = "cypher"
path = "src/main.rs"

[dependencies]
cypher-core = { path = "../cypher-core" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tokio-util.workspace = true
serde_json.workspace = true
semver = "1"
hex = "0.4"
url = "2"
tracing = "0.1"
# Warnungen des Kerns (z. B. ein ungültiger Katalog im Zwischenspeicher) auf die Fehlerausgabe
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
minisign = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"

# Rust-Workspace von Cypher Studio (Zone A): Kern ohne Tauri, Kommandozeile, Tauri-Schicht.
[workspace]
resolver = "3"
members = ["crates/cypher-core", "crates/cypher-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"
authors = ["Cypher Kollektiv"]
repository = "https://github.com/rouvenwieland/cypher-studio"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Pixelschleifen über `chunks_exact(4)` sind hier gewollt (RGBA8); `as_chunks` bringt keinen Gewinn
chunks_exact_to_as_chunks = "allow"

# Tests rechnen Bilder und entpacken Archive: Abhängigkeiten immer optimiert, eigener Code leicht optimiert
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Nicht `abort`: Fremd-Dekoder (Bilder, ICC, Archive) sollen bei einer präparierten Datei einen Fehler liefern, nicht die
# App beenden (`util::catch_panic`, tokio-Arbeitsthreads). Ein Test (`tests/hardening.rs`) hält das fest.
panic = "unwind"
strip = true

# Abhängigkeiten, die mehrere Crates teilen, stehen hier mit Version; Lizenz und Zweck: docs/third-party/A.md
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros", "net"] }
tokio-util = "0.7"

[package]
name = "cypher-studio"
version.workspace = true
description = "Cypher Studio – Zentrale für das Cypher Kollektiv"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# Das Suffix `_lib` ist nötig, damit der Bibliotheksname nicht mit dem Binärnamen kollidiert (Windows, cargo#8519).
name = "cypher_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cypher-core = { path = "../../../crates/cypher-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Desktop-Plugins (wie in der Tauri-Dokumentation empfohlen)
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

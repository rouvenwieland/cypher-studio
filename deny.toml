# cargo-deny: Lizenzen, Advisories, Quellen (ARCHITEKTUR.md 6.10, 8.7).
# Aufruf: cargo deny check

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error (unmaintained) kommt über Tauri/GTK3-Bindungen; kein Einfluss auf unseren Code.
  "RUSTSEC-2024-0370",
  # rsa (Marvin-Angriff, Schlüsselgewinnung über Laufzeitunterschiede) kommt über rPGP. Wir prüfen mit rPGP nur öffentliche
  # Signaturen (Krita-/Inkscape-AppImage); es gibt keine Entschlüsselung und keine Signatur mit privaten RSA-Schlüsseln.
  # Upstream hat keine Korrektur ("patched = []").
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5.5 (Laufzeitunterschiede bei Rechnungen mit geheimen Zahlen, gemeldet 10/2026) kommt über rPGP
  # (Kurven-Crates). Gefährdet wären nur Operationen mit geheimen Schlüsseln; wir prüfen ausschließlich öffentliche
  # Signaturen, es gibt keinen privaten Schlüssel in der App. Die Korrektur (>= 0.7.6) liegt in einer neuen Hauptversion
  # der Kurven-Crates, die rPGP 0.21 noch nicht nutzt. Erledigt sich mit einem rPGP-Update (Dependabot meldet es).
  "RUSTSEC-2026-0387",
  # zip 4.6.1 steckt in tauri-plugin-updater 2.14 (Entpacken von Update-Paketen). Betroffen ist nur `extract()` mit
  # Symlinks und SUID-Bits; unsere Update-Artefakte sind NSIS-Installer (Windows) und .tar.gz (macOS, Linux), und der eigene
  # Entpacker nutzt zip 9. Erledigt sich mit einem Update des Plugins, das zip >= 9 verwendet.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  # zbus_names, zvariant, zvariant_derive (nicht mehr eigenständig gepflegt, in zbus 6 aufgegangen; Meldung vom 17.10.2026).
  # Sie kommen über zbus 5.19 aus tauri-plugin-opener und tauri-plugin-single-instance (nur Linux, D-Bus). Es ist keine
  # Sicherheitslücke gemeldet, nur der Pflegestatus. Ein Wechsel auf zbus 6 liegt bei den Plugins; die neuesten Fassungen
  # (3.0.0-alpha.3) sind Vorabfassungen. Erledigt sich mit einem stabilen Plugin-Update (Dependabot meldet es).
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
version = 2
confidence-threshold = 0.9
# Allowlist wie ARCHITEKTUR.md 8.7. GPL/LGPL/AGPL sind in ausgelieferten Abhängigkeiten verboten.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "MPL-2.0",
  "OpenSSL",
  "Unlicense",
  "CDLA-Permissive-2.0",
  # libbz2-rs-sys (Rust-Neuschreibung von bzip2, kommt über zip/sevenz): BSD-ähnliche Lizenz von bzip2
  "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
  # Kein OpenSSL: TLS läuft über rustls.
  { crate = "openssl-sys" },
  { crate = "openssl" },
  # Sequoia ist LGPL; OpenPGP-Prüfung macht rPGP.
  { crate = "sequoia-openpgp" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

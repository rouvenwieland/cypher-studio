# cargo-deny: Lizenzen, Advisories, Quellen (ARCHITEKTUR.md 6.10, 8.7).
# Aufruf: cargo deny check

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Von Tauri/wry/GTK3 transitiv mitgebracht (gtk-rs 0.18 ist nicht mehr gepflegt); kein Einfluss auf unseren Code.
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2024-0429",
  "RUSTSEC-2024-0370",
]

[licenses]
version = 2
confidence-threshold = 0.9
# Allowlist wie ARCHITEKTUR.md 8.7. GPL/LGPL/AGPL sind in ausgelieferten Abhängigkeiten verboten.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "MPL-2.0",
  "OpenSSL",
  "Unlicense",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
  # Kein OpenSSL: TLS läuft über rustls.
  { crate = "openssl-sys" },
  { crate = "openssl" },
  # Sequoia ist LGPL; OpenPGP-Prüfung macht rPGP.
  { crate = "sequoia-openpgp" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
